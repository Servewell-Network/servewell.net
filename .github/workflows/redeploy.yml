name: Emergency Redeploy

on:
  workflow_dispatch:
    inputs:
      triggered_by:
        description: 'Path that triggered the redeploy (informational)'
        required: false
        default: 'manual'

permissions:
  contents: read

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify chapter pages
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://servewell.net/-/Genesis/1")
          echo "/-/Genesis/1 → HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "WARNING: chapter pages still not responding after redeploy"
            exit 1
          fi
